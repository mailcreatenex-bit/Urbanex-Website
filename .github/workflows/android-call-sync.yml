name: Build the Call Sync app

# Builds the phone app on GitHub's free servers: no Android Studio needed.
# Run it from the Actions tab (Run workflow), then download "urbanex-call-sync-apk" from the finished run.
on:
  workflow_dispatch: {}
  push:
    paths:
      - "android-call-sync/**"
      - ".github/workflows/android-call-sync.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build the app
        working-directory: android-call-sync
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: urbanex-call-sync-apk
          path: android-call-sync/app/build/outputs/apk/debug/app-debug.apk
