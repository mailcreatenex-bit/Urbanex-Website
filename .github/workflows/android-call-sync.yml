name: Build the UrbanexCRM app

# Builds the phone app on GitHub's free servers: no Android Studio needed.
# On the main branch it also publishes the finished file as a public download:
#   https://github.com/mailcreatenex-bit/Urbanex-Website/releases/tag/latest-apk
on:
  workflow_dispatch: {}
  push:
    paths:
      - "android-call-sync/**"
      - ".github/workflows/android-call-sync.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build the app
        working-directory: android-call-sync
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Name the file
        run: cp android-call-sync/app/build/outputs/apk/debug/app-debug.apk UrbanexCRM.apk
      - uses: actions/upload-artifact@v4
        with:
          name: urbanexcrm-apk
          path: UrbanexCRM.apk
      - name: Publish a public download (main branch only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk UrbanexCRM.apk --target "${{ github.sha }}" --title "UrbanexCRM (latest build)" --notes "Install this file on your Android phone. Steps: docs/CALL_SYNC_APP.md"
